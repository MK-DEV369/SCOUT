openapi: 3.0.3
info:
  title: Freightos Marketplace Rates Provider
  version: '1.0'
  description: |
      Freightos is making global trade frictionless with the world's largest freight marketplace. This API helps you provide your freight rates dynamically from your own rate management system to Freightos Marketplace.
      
      The Freightos Marketplace API suite consists of the following API:
      
      
      ##### Outbound APIs:
        - [Availability](docs/freightos-marketplace-apis/1/routes/your_availability_endpoint/post)
        - [Booking](docs/freightos-marketplace-apis/1/routes/your_booking_endpoint/post)
        - [Tracking](docs/freightos-marketplace-apis/1/routes/your_tracking_endpoint/post)
        
      ##### Inbound APIs:

        - [Booking](docs/freightos-marketplace-apis/1/routes/marketplace/shipment/booking/post)
        - [Tracking](docs/freightos-marketplace-apis/1/routes/marketplace/shipment/%7BshipmentNumber%7D/tracking/post)
        - [Charges](docs/freightos-marketplace-apis/1/routes/marketplace/shipment/%7BshipmentNumber%7D/charges/post)
        - [Attachments](docs/freightos-marketplace-apis/1/routes/marketplace/shipment/%7BshipmentNumber%7D/attachments/post)
        
tags:
  - name: Availability
  - name: Booking (Outbound)
  - name: Booking (Inbound)
  - name: Tracking (Outbound)
  - name: Tracking (Inbound)

paths:
  /your_availability_endpoint:
    post:
      tags: 
        -  Availability
      summary: "Initiated request coming from Freightos Marketplace"
      description: "Freightos Marketplace will trigger one or more requests to your designated endpoint service with every search performed by shippers. The request includes all captured information about the shipment including: Origin, Destination, Load, Shipper and any additional options that have been selected in the search process. This request normally expects rates returned from your system to show to the shipper."

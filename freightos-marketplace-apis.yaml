components:
  schemas:
    #############################################
    # Search request type
    #############################################
    AvailabilityRequestBody:
      type: object
      properties:
        messageHeader:
          type: object
          $ref: '#/components/schemas/MessageHeaderType'
        businessInfo:
          type: object
          $ref: '#/components/schemas/BusinessInfoType'
        shipment :
          type: object
          $ref: '#/components/schemas/FreightShipmentType'

    #############################################
    # Rates response type
    #############################################
    RatesResponseBody:
      type: object
      properties:
        messageHeader:
          type: object
          $ref: '#/components/schemas/MessageHeaderType'
        rates:
          type: array
          items:
            $ref: '#/components/schemas/FreightShipmentType'

    #############################################
    # Booking Outbound request type
    #############################################
    BookingOutboundRequest:
      type: object
      properties:
        messageHeader:
          type: object
          $ref: '#/components/schemas/MessageHeaderType'
        BusinessInfo:
          $ref: "#/components/schemas/BusinessInfoType"
          description: "Identification of the message Sender, receiver, account number and information about all parties involved in the exchange"
          shipment: 
            $ref: "#/components/schemas/FreightShipmentType"
            description: "Information about the main cargo to be transported"
          documentIdentifier: 
            description": "Optionally included when booking is confirmed. In most NEW Booking requests this object will not be passed."
            type": array
            items":
              $ref: "#/components/schemas/DocumentIdentifierType" 
    
    #############################################
    # Tracking Outbound request type
    #############################################
    TrackingOutboundRequest:
      type: object
      properties:
        messageHeader:
          type: object
          $ref: '#/components/schemas/MessageHeaderType'
        BusinessInfo:
          $ref: "#/components/schemas/BusinessInfoType"
          description: "Identification of the message Sender, receiver, account number and information about all parties involved in the exchange"
          shipment: 
            $ref: "#/components/schemas/FreightShipmentType"
            description: "Information about the main cargo to be transported"
          documentIdentifier: 
            description": "Optionally included when booking is confirmed. In most NEW Booking requests this object will not be passed."
            type": array
            items":
              $ref: "#/components/schemas/DocumentIdentifierType" 
    
    #############################################
    # General types
    #############################################

    MessageHeaderType:
      type: object
      properties:
        messageID:
          type: string
          description: his value uniquely identifies each message.
          example: out92bbfe5-29e7-4db2-84e0-64d1ea68888
        requestID:
          type: string
          description: Unique id used to link outbound and inbound messages
          example: 892bbfe5-29e7-4db2-84e0-64d1ea67557
    BusinessInfoType:
      type: object
      properties:
        parties:
          type: array
          description: Provides information about the shipper.
          items:
            $ref: "#/components/schemas/PartyType"
        summaryPayload:
          type: object
          description: Summary about the service
    DocumentContentType:
      description: Encoded file content
      type: object
      properties:
        content:
          description: the encoded content of the file
          type: string
        contentLength:
          description: File content-length used to make sure the file is not currupted
            while uploading
          type: integer
        documentEncoding:
          enum:
          - base64
        documentChecksum:
          description: Used to record the hash checksum of the document content, could
            be any hash algorithm [SHA-1, MD5 ...]
          type: string
    DocumentIdentifierType:
      description: Used to record the the information about the waybill information including
        the IDs for the House Waybill, Master waybill and Bill of Lading
      type: object
      properties:
        documentType:
          enum:
          - AWB
          - MAWB
          - HAWB
          - MBOL
          - HBOL
          - BOL
          - POA
          - PL
          - CI
          - CB
          - MSDS
          - ISF
          - AN
          - INSURANCE
          - OTHER
          - OTHER_FROM_SELLER
          - OTHER_FROM_BUYER
          - US_CUSTOMS_INVOICE
          - ACE
          - OTHER_TO_CUSTOMS_BROKERAGE
          - LABELS
          - EXPL
          type: string
          xml:
            name: DocumentType
        documentID:
          type: string
          xml:
            name: DocumentID
        documentURL:
          type: string
          xml:
            name: DocumentURL
        issueDate:
          type: string
          xml:
            name: IssueDate
        additionalID:
          type: string
          xml:
            name: AdditionalID
        electronicDocument:
          type: boolean
          xml:
            name: ElectronicDocument
        documentStatus:
          description: ''
          enum:
          - ACTIVE
          - DELETED
          type: string
        documentName:
          description: |-
            The document name with extention:
            'image/*',
            '.xlsx',
            '.xls',
            '.doc',
            '.docx',
            '.ppt',
            '.pptx',
            '.txt',
            '.pdf',
            '.csv',
            'application/msword',
            'application/pdf',
            'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
          type: string
        documentContent:
          "$ref": "#/components/schemas/DocumentContentType"
